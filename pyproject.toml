[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitoxic-robust"
version = "0.1.0"
description = "Reproducible Vietnamese toxic speech robustness research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ViToxic-Robust research team" }]
dependencies = []

[project.scripts]
vitoxic = "vitoxic_robust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
