name: NLP training from Hugging Face

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Training epochs (CPU smoke test: 1)'
        required: true
        type: number
        default: 1
      max_train_samples:
        description: 'Training samples (0 = full dataset)'
        required: true
        type: number
        default: 256
      max_eval_samples:
        description: 'Validation samples (0 = full dataset)'
        required: true
        type: number
        default: 64
      max_test_samples:
        description: 'Test samples (0 = full dataset)'
        required: true
        type: number
        default: 64

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_DATASET_ID: ${{ vars.HF_DATASET_ID || 'tarudesu/ViCTSD' }}
      HF_DATASET_REVISION: ${{ vars.HF_DATASET_REVISION || 'main' }}
      MODEL_NAME: ${{ vars.MODEL_NAME || 'distilbert/distilbert-base-multilingual-cased' }}
      HF_MODEL_REPO_ID: ${{ vars.HF_MODEL_REPO_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      EPOCHS: ${{ inputs.epochs }}
      MAX_TRAIN_SAMPLES: ${{ inputs.max_train_samples }}
      MAX_EVAL_SAMPLES: ${{ inputs.max_eval_samples }}
      MAX_TEST_SAMPLES: ${{ inputs.max_test_samples }}
      BATCH_SIZE: '4'
      MAX_LENGTH: '128'
      SEED: '42'
      OUTPUT_DIR: outputs

    steps:
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Fetch dataset and fine-tune classifier
        run: python scripts/train.py
      - name: Store model and metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vitoxic-nlp-model
          path: |
            outputs/model/
            outputs/metrics.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
